name: Local standalone and production regressions

on:
  push:
  pull_request:

jobs:
  local-cross-platform:
    name: Local standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install local dependencies
        run: python -m pip install -r requirements-local.txt
      - name: Install vendored PyMahjongGB from source
        run: python -m pip install ./third_party/pymahjonggb
      - name: Verify bundled timezone data
        run: python -c "from zoneinfo import ZoneInfo; import app.chips; ZoneInfo('Asia/Shanghai')"
      - name: Test standalone module - local gateway
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_local_gateway
      - name: Test standalone module - local MCP
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_local_mcp
      - name: Test standalone module - local NPC admission
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_local_npc_admission
      - name: Test standalone module - local launcher
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_local_launcher
      - name: Test standalone module - identity
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_identity
      - name: Test standalone module - MCP compact
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_mcp_compact
      - name: Test standalone module - compatibility
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_compatibility
      - name: Test standalone module - notifications
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_notifications
      - name: Test standalone module - hidden information audit
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_hidden_information_audit

  full-suite:
    name: Full suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install local dependencies
        run: python -m pip install -r requirements-local.txt
      - name: Install vendored PyMahjongGB from source
        run: python -m pip install ./third_party/pymahjonggb
      - name: Verify bundled timezone data
        run: python -c "from zoneinfo import ZoneInfo; import app.chips; ZoneInfo('Asia/Shanghai')"
      - name: Run full suite
        run: python -m unittest discover -s tests -v
