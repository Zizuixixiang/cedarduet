name: Local standalone and production regressions

on:
  push:
  pull_request:

jobs:
  local-cross-platform:
    name: Local standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install local dependencies
        run: python -m pip install -r requirements-local.txt
      - name: Install vendored PyMahjongGB from source
        run: python -m pip install ./third_party/pymahjonggb
      - name: Verify local entry points and production contracts
        run: >-
          python -m unittest -v
          tests.test_local_gateway
          tests.test_local_mcp
          tests.test_local_npc_admission
          tests.test_local_launcher
          tests.test_identity
          tests.test_mcp_compact
          tests.test_compatibility
          tests.test_notifications
          tests.test_hidden_information_audit

  full-suite:
    name: Full suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install local dependencies
        run: python -m pip install -r requirements-local.txt
      - name: Install vendored PyMahjongGB from source
        run: python -m pip install ./third_party/pymahjonggb
      - name: Run full suite
        run: python -m unittest discover -s tests -v
